name: Validar y publicar RC 1 Windows y Linux
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      LUMA_MICROSOFT_CLIENT_ID: ${{ secrets.LUMA_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar y verificar Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'Formato' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy' }
          cargo test --locked
          if ($LASTEXITCODE) { throw 'Pruebas' }
      - name: Compilar aplicación e instalador nativo y probar instalación
        shell: pwsh
        run: |
          ./build.ps1
          ./scripts/test-native-installer.ps1
          $env:LUMA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'luma-cli-rc1'
          ./target/release/luma-launcher.exe --list-profiles
          if ($LASTEXITCODE) { throw 'CLI' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc1-windows
          path: |
            artifacts/Luma-0.8.0-rc.1.exe
            artifacts/Luma-Setup.exe
            artifacts/luma-release.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    env:
      LUMA_MICROSOFT_CLIENT_ID: ${{ secrets.LUMA_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar herramientas y escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config binutils libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 libwayland-client0 libwayland-cursor0 libwayland-egl1 xdg-utils xvfb
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verificar y empaquetar
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          bash scripts/build-linux.sh
          python3 scripts/test-linux-package.py
      - name: Capturas de skins y contenido con datos aislados
        run: |
          fixture="$RUNNER_TEMP/luma-visual-$GITHUB_RUN_ID"
          python3 scripts/prepare-visual-fixtures.py "$fixture"
          for page in skins instance; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 LUMA_DATA_DIR="$fixture" LUMA_PREVIEW_PAGE="$page" LUMA_PREVIEW="$PWD/artifacts/rc1-$page.png" timeout 30s target/release/luma-launcher
            test -s "artifacts/rc1-$page.png"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc1-linux
          path: |
            artifacts/*rc.1*linux-x64*
            artifacts/*rc.1*amd64.deb
            artifacts/luma-release-linux-x64.json
            artifacts/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc1-visual-checks
          path: artifacts/rc1-*.png
          if-no-files-found: error
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Fernanboom34/Launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rc1-windows
          path: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rc1-linux
          path: linux
      - name: Verificar sumas y publicar como candidato a release
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p = Path("windows/SHA256SUMS.txt"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n"))'
          (cd windows && sha256sum -c SHA256SUMS.txt)
          (cd linux && sha256sum -c SHA256SUMS-linux-x64.txt)
          assets=(windows/Luma-0.8.0-rc.1.exe windows/Luma-Setup.exe windows/luma-release.json windows/SHA256SUMS.txt
                  linux/Luma-0.8.0-rc.1-linux-x64 linux/Luma-0.8.0-rc.1-linux-x64.tar.gz linux/luma-launcher_0.8.0-rc.1_amd64.deb linux/luma-release-linux-x64.json linux/SHA256SUMS-linux-x64.txt)
          gh release create v0.8.0-rc.1 --target "$GITHUB_SHA" --prerelease --latest=false --title 'Luma 0.8.0-rc.1 — Windows y Linux x64' --notes-file docs/RC1.md "${assets[@]}"
