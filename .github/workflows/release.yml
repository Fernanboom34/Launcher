name: Publicar Luma
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Rama a verificar (vacío: rama/tag del workflow)'
        required: false
        type: string
      publish:
        description: 'Publicar release (solo sin source_ref)'
        type: boolean
        default: false
      installer_only:
        description: 'Solo compilar y comprobar el prototipo Inno (sin publicar)'
        type: boolean
        default: false
      include_installer:
        description: 'Compilar y probar el nuevo Setup Inno antes de guardarlo'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    if: inputs.installer_only != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Preparar Rust estable
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Reutilizar dependencias de compilación
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-static-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-msvc-static-
      - name: Preparar certificado de firma opcional
        shell: pwsh
        env:
          LUMA_SIGNING_PFX_BASE64: ${{ secrets.LUMA_SIGNING_PFX_BASE64 }}
          LUMA_SIGNING_PFX_PASSWORD: ${{ secrets.LUMA_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:LUMA_SIGNING_PFX_BASE64) {
            $pfxFile = Join-Path $env:RUNNER_TEMP 'luma-signing.pfx'
            [IO.File]::WriteAllBytes($pfxFile, [Convert]::FromBase64String($env:LUMA_SIGNING_PFX_BASE64))
            try {
              $password = ConvertTo-SecureString $env:LUMA_SIGNING_PFX_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfxFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
              "LUMA_SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } finally { Remove-Item -LiteralPath $pfxFile -Force }
          }
      - name: Verificar y compilar
        shell: pwsh
        env:
          LUMA_MICROSOFT_CLIENT_ID: ${{ secrets.LUMA_MICROSOFT_CLIENT_ID }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'El formato falló' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy falló' }
          cargo test --locked
          if ($LASTEXITCODE) { throw 'Las pruebas fallaron' }
          ./build.ps1
      - name: Guardar compilacion antes de probar instalador
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-static-${{ hashFiles('Cargo.lock') }}
      - name: Compilar y probar nuevo instalador
        if: inputs.include_installer == true
        shell: pwsh
        run: |
          ./scripts/test-native-installer.ps1
      - name: Guardar launcher de verificación
        uses: actions/upload-artifact@v4
        with:
          name: Luma-verificacion-${{ github.run_id }}
          path: |
            artifacts/Luma-*.exe
            !artifacts/Luma-Setup.exe
            artifacts/luma-release.json
            artifacts/SHA256SUMS.txt
          retention-days: 7
      - name: Guardar nuevo Setup verificado
        if: inputs.include_installer == true
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Setup-verificacion-${{ github.run_id }}
          path: artifacts/Luma-Setup.exe
          retention-days: 7
      - name: Publicar ejecutables y manifiesto
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish == true && inputs.source_ref == '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content artifacts/luma-release.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) { throw 'El tag no coincide con Cargo.toml' }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE) {
            gh release create $tag "artifacts/Luma-$version.exe" artifacts/Luma-Setup.exe artifacts/luma-release.json artifacts/SHA256SUMS.txt --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Luma $version" --generate-notes
          } else {
            gh release upload $tag "artifacts/Luma-$version.exe" artifacts/Luma-Setup.exe artifacts/luma-release.json artifacts/SHA256SUMS.txt --repo '${{ github.repository }}' --clobber
          }
          if ($LASTEXITCODE) { throw 'No se pudo publicar el release' }
  installer-draft:
    if: inputs.installer_only == true
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Compilar prototipo estandar
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Falta Inno Setup en el runner' }
          & $compiler installer/Luma.iss
          if ($LASTEXITCODE) { throw 'El prototipo Inno no compila' }
      - name: Comprobar rechazo del release estable anterior
        if: hashFiles('scripts/test-native-installer.ps1') == ''
        shell: pwsh
        run: |
          $probeFolder = Join-Path $env:RUNNER_TEMP 'Luma-installer-probe'
          $probeLog = Join-Path $env:RUNNER_TEMP 'Luma-installer-probe.log'
          $arguments = @('/VERYSILENT','/NORESTART','/SP-','/SUPPRESSMSGBOXES',"/DIR=$probeFolder","/LOG=$probeLog")
          $process = Start-Process -FilePath artifacts/installer-draft/Luma-Setup-DRAFT.exe -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $probeLog
          if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath (Join-Path $probeFolder 'Luma.exe'))) { throw 'El prototipo no debia instalar el release 0.7.0' }
          if (!(Select-String -LiteralPath $probeLog -SimpleMatch 'Todavia no hay un release compatible')) { throw 'La prueba no alcanzo la comprobacion de version minima' }
