name: Publicar Luma
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    # Betas are published explicitly, without the old Setup or stable updates.
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Rust estable
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Preparar certificado de firma opcional
        shell: pwsh
        env:
          LUMA_SIGNING_PFX_BASE64: ${{ secrets.LUMA_SIGNING_PFX_BASE64 }}
          LUMA_SIGNING_PFX_PASSWORD: ${{ secrets.LUMA_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:LUMA_SIGNING_PFX_BASE64) {
            $pfxFile = Join-Path $env:RUNNER_TEMP 'luma-signing.pfx'
            [IO.File]::WriteAllBytes($pfxFile, [Convert]::FromBase64String($env:LUMA_SIGNING_PFX_BASE64))
            try {
              $password = ConvertTo-SecureString $env:LUMA_SIGNING_PFX_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfxFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
              "LUMA_SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } finally { Remove-Item -LiteralPath $pfxFile -Force }
          }
      - name: Verificar y compilar
        shell: pwsh
        env:
          LUMA_MICROSOFT_CLIENT_ID: ${{ secrets.LUMA_MICROSOFT_CLIENT_ID }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'El formato falló' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy falló' }
          cargo test --locked
          if ($LASTEXITCODE) { throw 'Las pruebas fallaron' }
          ./build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stable-windows
          path: artifacts/
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: stable-windows
          path: artifacts
      - name: Verificar sumas y crear un release nuevo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -r .version artifacts/luma-release.json)
          tag="v$version"
          test "$GITHUB_REF_NAME" = "$tag"
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" "artifacts/Luma-$version.exe" artifacts/Luma-Setup.exe artifacts/luma-release.json artifacts/SHA256SUMS.txt --verify-tag --title "Luma $version" --generate-notes
