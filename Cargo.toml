[package]
name = "luma-launcher"
version = "0.7.1-beta.1"
edition = "2021"
description = "Launcher de Minecraft Java Edition escrito en Rust"

default-run = "luma-launcher"

[dependencies]
anyhow = "1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
rayon = "1"
webbrowser = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
getrandom = "0.2"
url = "2"
rfd = "0.15"
flate2 = "1"
fastnbt = "2"
shell-words = "1"

[profile.release]
strip = true
lto = "thin"


[target.'cfg(windows)'.dependencies]
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
tao = "0.35"
